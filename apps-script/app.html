<script>
// 구글시트와 통신: 같은 Apps Script의 서버 함수를 google.script.run으로 호출합니다.
// 이 웹 앱은 '나만' 접근 가능하므로, 구글이 내 계정 로그인 여부를 직접 확인합니다.
const Api = {
  run(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((e) => reject(new Error((e && e.message) || String(e))))[fn](...args);
    });
  },
  list() { return this.run('apiList'); },
  add(entry) { return this.run('apiAdd', entry); },
  update(entry) { return this.run('apiUpdate', entry); },
  remove(id) { return this.run('apiRemove', id); },
  ocr(base64) { return this.run('apiOcr', base64); },
};

const CATEGORIES = {
  지출: ['식비', '카페·간식', '교통', '주거·통신', '생활용품', '쇼핑', '의료·건강', '문화·여가', '교육', '경조사·선물', '기타'],
  수입: ['급여', '부수입', '용돈', '금융수입', '기타'],
};
const METHODS = ['현금', '체크카드', '신용카드', '계좌이체'];

const $ = (id) => document.getElementById(id);
const won = (n) => n.toLocaleString('ko-KR') + '원';
const pad = (n) => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];

const state = { entries: [], month: today().slice(0, 7), editing: null, form: { category: '', method: '' } };

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- 화면 그리기 ----------
function render() {
  const [y, m] = state.month.split('-').map(Number);
  $('monthLabel').textContent = `${y}년 ${m}월`;

  const items = state.entries.filter((e) => e.date.startsWith(state.month));
  let income = 0, expense = 0;
  const byCat = {};
  for (const e of items) {
    if (e.type === '수입') income += e.amount;
    else { expense += e.amount; byCat[e.category || '기타'] = (byCat[e.category || '기타'] || 0) + e.amount; }
  }
  $('incomeSum').textContent = won(income);
  $('expenseSum').textContent = won(expense);
  $('balance').textContent = (income - expense < 0 ? '-' : '') + won(Math.abs(income - expense));

  // 카테고리별 지출 (상위 5개)
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 5);
  $('categoryCard').hidden = cats.length === 0;
  $('categoryBars').replaceChildren(...cats.map(([name, v]) => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="name"></span><span class="track"><span class="fill"></span></span><span class="val"></span>';
    li.querySelector('.name').textContent = name;
    li.querySelector('.fill').style.width = (v / cats[0][1]) * 100 + '%';
    li.querySelector('.val').textContent = `${won(v)} · ${Math.round((v / expense) * 100)}%`;
    return li;
  }));

  // 날짜별 목록 (최신순)
  const groups = {};
  for (const e of items) (groups[e.date] ||= []).push(e);
  const days = Object.keys(groups).sort().reverse();
  $('list').replaceChildren(...days.map((date) => {
    const list = groups[date].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    const net = list.reduce((s, e) => s + (e.type === '수입' ? e.amount : -e.amount), 0);
    const sec = document.createElement('div');
    sec.className = 'day';
    const d = new Date(date + 'T00:00:00');
    sec.innerHTML = '<div class="day-head"><span></span><span></span></div><div class="day-items"></div>';
    sec.querySelector('.day-head span:first-child').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`;
    sec.querySelector('.day-head span:last-child').textContent = (net > 0 ? '+' : net < 0 ? '-' : '') + won(Math.abs(net));
    sec.querySelector('.day-items').append(...list.map(itemEl));
    return sec;
  }));
  $('emptyMsg').hidden = items.length > 0;
}

function itemEl(e) {
  const b = document.createElement('button');
  b.className = 'item';
  b.type = 'button';
  b.innerHTML = '<span class="badge"></span><span class="main"><div class="t1"></div><div class="t2"></div></span><span class="amt"></span>';
  b.querySelector('.badge').textContent = (e.category || '기타').slice(0, 2);
  b.querySelector('.t1').textContent = e.place || e.memo || e.category || e.type;
  b.querySelector('.t2').textContent = [e.category, e.method, e.items && e.items.length ? `품목 ${e.items.length}개` : '', e.place && e.memo]
    .filter(Boolean).join(' · ');
  const amt = b.querySelector('.amt');
  amt.textContent = (e.type === '수입' ? '+' : '-') + won(e.amount);
  amt.classList.add(e.type === '수입' ? 'income' : 'expense');
  b.addEventListener('click', () => openEntry(e));
  return b;
}

// ---------- 데이터 불러오기 ----------
async function load() {
  $('status').textContent = '불러오는 중…';
  try {
    state.entries = await Api.list();
    $('status').textContent = '';
  } catch (err) {
    $('status').textContent = '불러오지 못했어요: ' + err.message;
  }
  render();
}

// ---------- 입력/수정 ----------
function chips(container, options, selected, onPick) {
  container.replaceChildren(...options.map((opt) => {
    const c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip';
    c.textContent = opt;
    c.setAttribute('aria-pressed', String(opt === selected));
    c.addEventListener('click', () => {
      const next = opt === selected ? '' : opt;
      onPick(next);
    });
    return c;
  }));
}
function currentType() { return $('entryForm').querySelector('input[name="type"]:checked').value; }
function drawChips() {
  chips($('categoryChips'), CATEGORIES[currentType()], state.form.category, (v) => { state.form.category = v; drawChips(); });
  chips($('methodChips'), METHODS, state.form.method, (v) => { state.form.method = v; drawChips(); });
}

// e: 수정할 내역, draft: 영수증에서 읽어 미리 채울 값(새 내역)
function openEntry(e = null, draft = null) {
  state.editing = e;
  const v = e || draft;
  $('entryTitle').textContent = e ? '내역 수정' : draft ? '영수증에서 읽은 내역' : '내역 추가';
  $('entryHint').hidden = !draft;
  $('deleteBtn').hidden = !e;
  $('entryError').textContent = '';
  $('entryForm').querySelector(`input[name="type"][value="${v ? v.type || '지출' : '지출'}"]`).checked = true;
  $('amount').value = v && v.amount ? v.amount.toLocaleString('ko-KR') : '';
  // 다른 달을 보고 있을 때 새 내역은 그 달 1일이 아니라 오늘 날짜가 기본값
  $('date').value = (v && v.date) || today();
  $('place').value = (v && v.place) || '';
  $('memo').value = (v && v.memo) || '';
  state.form = { category: (v && v.category) || '', method: (v && v.method) || '' };
  drawChips();
  $('itemRows').replaceChildren(...((v && v.items) || []).map(itemRow));
  updateItemsSum();
  $('entryDialog').showModal();
  if (!e && !draft) $('amount').focus();
}

$('amount').addEventListener('input', (ev) => {
  const digits = ev.target.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 12);
  ev.target.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
  updateItemsSum();
});

// ---------- 품목 ----------
const toNum = (s) => Number(String(s).replace(/[^\d-]/g, '')) || 0;
const fmt = (n) => (n ? n.toLocaleString('ko-KR') : '');

// 한 품목 = 품명 한 줄 + [수량] × [단가] = [금액] [삭제]
function itemRow(it = {}) {
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML =
    '<input class="i-name" maxlength="60" placeholder="품명" autocomplete="off">' +
    '<div class="i-nums">' +
    '<input class="i-qty" inputmode="numeric" placeholder="수량" aria-label="수량"><span>×</span>' +
    '<input class="i-price" inputmode="numeric" placeholder="단가" aria-label="단가"><span>=</span>' +
    '<input class="i-amount" inputmode="numeric" placeholder="금액" aria-label="금액">' +
    '<button type="button" class="icon-btn i-del" aria-label="품목 삭제">✕</button></div>';
  const [name, qty, price, amount] = ['.i-name', '.i-qty', '.i-price', '.i-amount'].map((s) => row.querySelector(s));
  name.value = it.name || '';
  qty.value = it.qty || '';
  price.value = fmt(it.price);
  amount.value = fmt(it.amount);
  const money = (inp) => { const n = toNum(inp.value); inp.value = n ? n.toLocaleString('ko-KR') : (inp.value.trim() === '-' ? '-' : ''); };
  // 수량이나 단가를 바꾸면 금액을 다시 계산 (할인처럼 금액만 있는 줄은 금액을 직접 입력)
  const recalc = () => { const q = toNum(qty.value), p = toNum(price.value); if (q && p) amount.value = fmt(q * p); updateItemsSum(); };
  qty.addEventListener('input', () => { qty.value = qty.value.replace(/\D/g, '').slice(0, 4); recalc(); });
  price.addEventListener('input', () => { money(price); recalc(); });
  amount.addEventListener('input', () => { money(amount); updateItemsSum(); });
  row.querySelector('.i-del').addEventListener('click', () => { row.remove(); updateItemsSum(); });
  return row;
}

function readItems() {
  return [...$('itemRows').children].map((row) => ({
    name: row.querySelector('.i-name').value.trim(),
    qty: toNum(row.querySelector('.i-qty').value),
    price: toNum(row.querySelector('.i-price').value),
    amount: toNum(row.querySelector('.i-amount').value),
  })).filter((it) => it.name || it.amount);
}

function updateItemsSum() {
  const items = readItems();
  if (!items.length) { $('itemsSum').textContent = ''; return; }
  const sum = items.reduce((s, it) => s + it.amount, 0);
  const total = toNum($('amount').value);
  const diff = total - sum;
  $('itemsSum').textContent = `품목 합계 ${won(sum)}` + (total && diff ? ` · 금액과 ${won(Math.abs(diff))} 차이` : '');
  $('itemsSum').classList.toggle('warn', !!(total && diff));
}

$('addItemBtn').addEventListener('click', () => {
  const row = itemRow();
  $('itemRows').append(row);
  row.querySelector('.i-name').focus();
});
$('entryForm').querySelectorAll('input[name="type"]').forEach((r) => r.addEventListener('change', () => {
  if (!CATEGORIES[currentType()].includes(state.form.category)) state.form.category = '';
  drawChips();
}));

$('entryForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const amount = Number($('amount').value.replace(/\D/g, ''));
  if (!amount) { $('entryError').textContent = '금액을 입력해 주세요.'; return; }
  if (!state.form.category) { $('entryError').textContent = '카테고리를 골라 주세요.'; return; }

  const e = {
    id: state.editing ? state.editing.id : (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
    date: $('date').value,
    type: currentType(),
    amount,
    category: state.form.category,
    method: state.form.method,
    place: $('place').value.trim(),
    memo: $('memo').value.trim(),
    createdAt: state.editing ? state.editing.createdAt : new Date().toISOString(),
    items: readItems(),
  };
  if (e.items.some((it) => !it.name)) { $('entryError').textContent = '품명이 비어 있는 품목이 있어요.'; return; }
  $('saveBtn').disabled = true;
  try {
    if (state.editing) {
      await Api.update(e);
      state.entries = state.entries.map((x) => (x.id === e.id ? e : x));
    } else {
      await Api.add(e);
      state.entries.push(e);
    }
    $('entryDialog').close();
    state.month = e.date.slice(0, 7);
    render();
    toast(state.editing ? '수정했어요' : '저장했어요');
  } catch (err) {
    $('entryError').textContent = err.message;
  } finally {
    $('saveBtn').disabled = false;
  }
});

$('deleteBtn').addEventListener('click', async () => {
  const e = state.editing;
  if (!e || !confirm('이 내역을 삭제할까요?')) return;
  $('deleteBtn').disabled = true;
  try {
    await Api.remove(e.id);
    state.entries = state.entries.filter((x) => x.id !== e.id);
    $('entryDialog').close();
    render();
    toast('삭제했어요');
  } catch (err) {
    $('entryError').textContent = err.message;
  } finally {
    $('deleteBtn').disabled = false;
  }
});

// ---------- 설정 ----------
function openSettings() {
  if (!$('qr').hasChildNodes() && window.QRCode) {
    new QRCode($('qr'), { text: APP_URL, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  }
  $('settingsDialog').showModal();
}

$('reloadBtn').addEventListener('click', () => { $('settingsDialog').close(); load(); });

// ---------- 공통 ----------
document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach((d) => d.addEventListener('click', (ev) => { if (ev.target === d) d.close(); }));

function shiftMonth(delta) {
  const [y, m] = state.month.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  state.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  render();
}
$('prevMonth').addEventListener('click', () => shiftMonth(-1));
$('nextMonth').addEventListener('click', () => shiftMonth(1));
$('openSettings').addEventListener('click', openSettings);
$('addBtn').addEventListener('click', () => openEntry());

// ---------- 영수증 ----------
// 사진을 긴 변 2000px JPEG로 줄여 전송 시간을 줄입니다.
function toJpegBase64(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 열지 못했어요. 다른 사진으로 해 주세요.')); };
    img.src = url;
  });
}

const RECEIPT_TOTAL_WORDS = ['결제금액', '승인금액', '받을금액', '청구금액', '합계금액', '총결제', '판매금액', '총금액', '총액', '합계', 'total', '카드결제'];
const RECEIPT_SKIP_LINE = /부가세|부가가치세|세액|과세|면세|할인|거스름|잔돈|포인트|적립|공급가/;
const CATEGORY_WORDS = [
  ['카페·간식', /카페|커피|coffee|스타벅스|starbucks|이디야|투썸|메가mgc|메가커피|빽다방|컴포즈|할리스|폴바셋|베이커리|파리바게뜨|뚜레쥬르|배스킨|던킨|디저트/i],
  ['의료·건강', /약국|병원|의원|치과|한의원|안과|피부과|정형외과|내과|소아과|이비인후과/],
  ['교통', /주유|주차|택시|버스|철도|코레일|ktx|srt|고속도로|하이패스|충전소|오일뱅크|sk에너지|gs칼텍스|s-oil/i],
  ['문화·여가', /영화|cgv|메가박스|롯데시네마|문고|책방|교보문고|yes24|노래|pc방|볼링|헬스|공연|티켓/i],
  ['생활용품', /다이소|이마트|홈플러스|롯데마트|코스트코|트레이더스|하나로마트|마트|생활용품/i],
  ['쇼핑', /올리브영|백화점|아울렛|무신사|쿠팡|유니클로|자라|h&m|의류/i],
  ['식비', /식당|음식|김밥|분식|국밥|치킨|피자|버거|맥도날드|롯데리아|맘스터치|서브웨이|반점|짬뽕|족발|보쌈|고기|갈비|삼겹|횟집|초밥|돈까스|라멘|국수|냉면|편의점|gs25|\bcu\b|세븐일레븐|7-eleven|이마트24|미니스톱|도시락|배달의민족|요기요/i],
];

// 숫자 인식: 12,500 / 12.500(쉼표를 점으로 읽은 경우) / 12500
function amountsIn(line) {
  const out = [];
  for (const m of line.matchAll(/(?<![\d\-:])(\d{1,3}(?:[,.]\d{3})+|\d{3,7})(?![\d\-:])/g)) {
    const n = Number(m[1].replace(/[,.]/g, ''));
    if (n >= 100 && n <= 50000000) out.push(n);
  }
  return out;
}

// 품목 줄 인식. 지원 형식:
//   "001 서울우유 1L  2,650  2  5,300"          (품명 단가 수량 금액)
//   "서울우유 1L" + 다음 줄 "8801115114154 2,650 2 5,300" (바코드 줄 분리)
//   "신라면 2 9,960"                              (품명 수량 금액)
//   "행사할인 -1,000"                             (할인)
// 범위는 '상품명/품명' 머리글 다음 줄부터 합계·과세 같은 요약 줄 전까지입니다.
function parseItems(lines) {
  const sq = (l) => l.replace(/\s/g, '');
  const isNum = (t) => /^-?\d{1,3}(?:[,.]\d{3})+-?$|^-?\d+-?$/.test(t);
  const val = (t) => (/^-|-$/.test(t) ? -1 : 1) * Number(t.replace(/[^\d]/g, ''));
  const SUMMARY = /합계|총액|총금액|결제|과세|면세|부가세|받을|청구|소계|공급가|total/i;
  const NOT_ITEM = /사업자|전화|tel|주소|카드|승인|일시|pos|영수증|대표|가맹점|상호|교환|환불/i;

  const h = lines.findIndex((l) => /(상품명|품명|품목|메뉴명?).*(단가|수량|금액)|^(상품명|품명)$/.test(sq(l)));
  const hasHeader = h >= 0;
  const start = hasHeader ? h + 1 : 0;
  let end = lines.findIndex((l, i) => i >= start && SUMMARY.test(sq(l)));
  if (end < 0) end = lines.length;

  const items = [];
  let pendingName = '';
  for (let i = start; i < end; i++) {
    const tokens = lines[i].replace(/원/g, '').split(' ');
    const nums = [];
    while (tokens.length && isNum(tokens[tokens.length - 1])) nums.unshift(tokens.pop());
    let name = tokens.join(' ')
      .replace(/^\d{1,3}\s+/, '')            // 순번 001
      .replace(/^[*#P]\s*/, '')               // 행사·면세 표시
      .replace(/\b\d{8,14}\b/g, '')           // 바코드
      .trim();
    const values = nums.filter((t) => !/^\d{8,14}$/.test(t)).map(val);

    if (!values.length) {                       // 숫자 없는 줄 = 다음 줄 숫자의 품명일 수 있음
      if (/[가-힣a-zA-Z]/.test(name) && !NOT_ITEM.test(name)) pendingName = name;
      continue;
    }
    if (!name) name = pendingName;
    pendingName = '';
    if (!name || NOT_ITEM.test(name)) continue;

    const last = values[values.length - 1];
    if (/할인|쿠폰|에누리/.test(name)) {          // 할인 줄은 금액만 음수로
      if (hasHeader) items.push({ name, qty: 0, price: 0, amount: -Math.abs(last) });
      continue;
    }
    if (values.length >= 3) {
      const [a, b, c] = values.slice(-3);
      if (a * b === c) {
        const qty = b <= a ? b : a;
        items.push({ name, qty, price: c / qty, amount: c });
      } else if (hasHeader && b > 0 && b <= 99) {
        items.push({ name, qty: b, price: a, amount: c });   // 품목 할인이 반영된 금액
      }
    } else if (values.length === 2) {
      const [a, b] = values;
      if (a > 0 && a <= 99 && b >= 100) items.push({ name, qty: a, price: Math.round(b / a), amount: b });
      else if (hasHeader && a >= 100 && b % a === 0 && b / a <= 99) items.push({ name, qty: b / a, price: a, amount: b });
    } else if (values.length === 1 && hasHeader && last >= 100) {
      items.push({ name, qty: 1, price: last, amount: last });
    }
  }
  return items.slice(0, 100);
}

function parseReceipt(text) {
  const lines = text.split(/\r?\n/).map((l) => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const squash = (l) => l.replace(/\s/g, '').toLowerCase();

  // 합계 금액: 우선순위가 높은 단어가 있는 줄의 금액 → 없으면 다음 줄 금액
  let amount = 0;
  for (const word of RECEIPT_TOTAL_WORDS) {
    const i = lines.findIndex((l) => squash(l).includes(word) && !RECEIPT_SKIP_LINE.test(squash(l)));
    if (i < 0) continue;
    const here = amountsIn(lines[i]);
    const next = lines[i + 1] ? amountsIn(lines[i + 1]) : [];
    amount = here.length ? here[here.length - 1] : next[0] || 0;
    if (amount) break;
  }
  if (!amount) {
    const all = lines
      .filter((l) => !/사업자|전화|tel|카드번호|승인번호|번호|주소/i.test(l))
      .flatMap(amountsIn);
    amount = all.length ? Math.max(...all) : 0;
  }

  // 날짜: 2026.11.09 / 2026-11-09 / 2026년 11월 9일 / 26.11.09
  let date = '';
  const valid = (y, m, d) => m >= 1 && m <= 12 && d >= 1 && d <= 31 && y >= 2000 && y <= 2099;
  let m = text.match(/(20\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if (m && valid(+m[1], +m[2], +m[3])) date = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if (!date) {
    m = text.match(/(?<!\d)(\d{2})[.\-\/](\d{2})[.\-\/](\d{2})(?!\d)/);
    if (m && valid(2000 + +m[1], +m[2], +m[3])) date = `20${m[1]}-${m[2]}-${m[3]}`;
  }

  // 사용처: '상호/가맹점명' 줄 → 없으면 위쪽 6줄 중 가게 이름처럼 보이는 줄
  let place = '';
  for (const l of lines) {
    const pm = l.match(/(?:상호|가맹점명|매장명|점포명|가맹점)\s*[:：]?\s*(.+)/);
    if (pm) { place = pm[1].split(/대표|사업자|전화|tel/i)[0].trim(); if (place) break; }
  }
  if (!place) {
    place = lines.slice(0, 6).find((l) =>
      l.length >= 2 && l.length <= 30 && /[가-힣a-zA-Z]/.test(l) &&
      !/영수증|receipt|사업자|대표|전화|tel|주소|카드|매출|pos|고객|일시|번호|\d{2,4}-\d/i.test(l)) || '';
  }
  place = place.replace(/\(주\)|㈜|주식회사/g, '').replace(/^[\[\(<]+|[\]\)>]+$/g, '').trim().slice(0, 50);

  // 결제수단
  const s = squash(text);
  const method = /체크/.test(s) ? '체크카드' : /신용|카드|승인번호/.test(s) ? '신용카드' : /현금/.test(s) ? '현금' : '';

  // 카테고리: 가게 이름과 영수증 내용에서 단어로 추정
  const hay = place + ' ' + lines.slice(0, 15).join(' ');
  const hit = CATEGORY_WORDS.find(([, re]) => re.test(hay));

  return { type: '지출', amount, date, place, method, category: hit ? hit[0] : '', memo: '', items: parseItems(lines) };
}

$('receiptBtn').addEventListener('click', () => $('receiptInput').click());
$('receiptInput').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  const btn = $('receiptBtn');
  btn.disabled = true;
  btn.classList.add('busy');
  toast('영수증 읽는 중… (5~10초)');
  try {
    const text = await Api.ocr(await toJpegBase64(file));
    const draft = parseReceipt(text || '');
    openEntry(null, draft);
    if (!draft.amount) $('entryError').textContent = '금액을 찾지 못했어요. 직접 입력해 주세요.';
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false;
    btn.classList.remove('busy');
  }
});

load();
</script>
