<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <?!= include('style') ?>
</head>
<body>
  <div class="app">
    <header class="top">
      <button class="icon-btn" id="prevMonth" aria-label="이전 달">‹</button>
      <h1 id="monthLabel"></h1>
      <button class="icon-btn" id="nextMonth" aria-label="다음 달">›</button>
      <button class="icon-btn settings-btn" id="openSettings" aria-label="설정">⚙</button>
    </header>

    <section class="card summary">
      <div class="label">이번 달 잔액</div>
      <div class="balance" id="balance">0원</div>
      <div class="split">
        <div><span class="label">수입</span><strong class="income" id="incomeSum">0원</strong></div>
        <div><span class="label">지출</span><strong class="expense" id="expenseSum">0원</strong></div>
      </div>
    </section>

    <section class="card" id="categoryCard" hidden>
      <div class="card-title">카테고리별 지출</div>
      <ul class="bars" id="categoryBars"></ul>
    </section>

    <section id="list" class="list"></section>
    <p class="empty" id="emptyMsg" hidden>이번 달 내역이 없어요.<br>아래 + 버튼으로 첫 내역을 기록해 보세요.</p>
    <p class="status" id="status"></p>
  </div>

  <button class="fab receipt" id="receiptBtn" aria-label="영수증 촬영">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
  </button>
  <input type="file" id="receiptInput" accept="image/*" hidden>
  <button class="fab" id="addBtn" aria-label="내역 추가">+</button>

  <!-- 입력/수정 -->
  <dialog id="entryDialog" class="sheet">
    <form id="entryForm" method="dialog">
      <div class="sheet-head">
        <h2 id="entryTitle">내역 추가</h2>
        <button type="button" class="icon-btn" data-close aria-label="닫기">✕</button>
      </div>
      <p class="hint" id="entryHint" hidden>영수증에서 읽은 값이에요. 맞는지 확인하고 저장하세요.</p>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="type" value="지출" checked><span>지출</span></label>
        <label><input type="radio" name="type" value="수입"><span>수입</span></label>
      </div>
      <label class="field amount-field">
        <span>금액</span>
        <div class="amount-wrap"><input id="amount" inputmode="numeric" autocomplete="off" placeholder="0" required><em>원</em></div>
      </label>
      <label class="field"><span>날짜</span><input type="date" id="date" required></label>
      <div class="field"><span>카테고리</span><div class="chips" id="categoryChips"></div></div>
      <div class="field"><span>결제수단</span><div class="chips" id="methodChips"></div></div>
      <label class="field"><span>가맹점명</span><input id="place" maxlength="50" placeholder="예: 이마트 역삼점" autocomplete="off"></label>
      <label class="field"><span>메모</span><input id="memo" maxlength="200" placeholder="선택" autocomplete="off"></label>
      <div class="field">
        <span>품목</span>
        <div id="itemRows" class="item-rows"></div>
        <div class="items-foot">
          <button type="button" class="chip" id="addItemBtn">+ 품목 추가</button>
          <span class="hint" id="itemsSum"></span>
        </div>
      </div>
      <p class="form-error" id="entryError"></p>
      <div class="actions">
        <button type="button" class="btn danger" id="deleteBtn" hidden>삭제</button>
        <button type="submit" class="btn primary grow" id="saveBtn">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 설정 -->
  <dialog id="settingsDialog" class="sheet">
    <form id="settingsForm" method="dialog">
      <div class="sheet-head">
        <h2>설정</h2>
        <button type="button" class="icon-btn" data-close aria-label="닫기">✕</button>
      </div>
      <p class="hint">내 구글 계정으로 로그인한 경우에만 열리는 가계부예요.</p>
      <div class="qr-box">
        <p class="hint">휴대폰 카메라로 찍으면 휴대폰에서 열려요. 열린 화면에서 <b>홈 화면에 추가</b>를 하세요.</p>
        <div id="qr"></div>
      </div>
      <div class="actions col">
        <a class="btn" href="<?= sheetUrl ?>" target="_blank" rel="noopener">구글시트 열기</a>
        <button type="button" class="btn" id="reloadBtn">새로고침</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>const APP_URL = <?!= JSON.stringify(appUrl) ?>;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <?!= include('app') ?>
</body>
</html>
